# Dynamic schema for the "Launcher Settings" screen.
# Same conventions as comfyui_schema.toml:
#   - String values in `name`, `desc`, `label`, and tab `name` are i18n
#     KEYS, resolved through `core::i18n::t()` at render time.
#   - Field `key` is the in-memory config key (e.g. `general.language`,
#     `network.pypi_mirror`). The setter in general_settings.rs looks it
#     up to know which Config field to mutate.
#   - `cli` is intentionally left blank — these are launcher-side settings
#     and never appear on the ComfyUI command line.
#
# Settings live in `launcher_config.toml`; this file is just the layout.

[[tab]]
name = "menu_general"

[[tab.field]]
key = "general.comfyui_dir"
name = "setting_comfy_dir"
desc = "setting_comfy_dir_desc"
type = "custom"
cli = ""
default = ""

[[tab.field]]
key = "general.python"
name = "setting_python"
desc = "setting_python_desc"
type = "custom"
cli = ""
default = ""

[[tab.field]]
key = "general.language"
name = "setting_language"
desc = "setting_language_desc"
# Special type: options come from `core::i18n::available_locales()` at
# render time — auto-detected from `assets/i18n/*.toml`. No hard-coded
# locale list anywhere.
type = "language_choice"
cli = ""
default = "en-US"

[[tab.field]]
key = "general.git_concurrency"
name = "setting_git_concurrency"
desc = "setting_git_concurrency_desc"
type = "custom"
cli = ""
default = "1"

[[tab.field]]
key = "network.pypi_mirror"
name = "setting_pypi_mirror"
desc = "setting_pypi_mirror_desc"
type = "custom"
cli = ""
default = ""

[[tab.field]]
key = "network.git_mirror"
name = "setting_git_mirror"
desc = "setting_git_mirror_desc"
type = "custom"
cli = ""
default = ""

[[tab.field]]
key = "network.hf_mirror"
name = "setting_hf_mirror"
desc = "setting_hf_mirror_desc"
type = "custom"
cli = ""
default = ""

[[tab.field]]
key = "network.hf_force_mirror"
name = "setting_hf_force_mirror"
desc = "setting_hf_force_mirror_desc"
type = "toggle"
cli = ""
default = false

[[tab.field]]
key = "network.github_accel"
name = "setting_github_accel"
desc = "setting_github_accel_desc"
type = "custom"
cli = ""
default = ""

# ── ComfyUI process lifecycle (launcher-side) ──
# These never reach the ComfyUI command line. Each final process outcome has
# an independent action. The numeric fields only apply to automatic restarts.

[[tab.field]]
key = "general.normal_exit_action"
name = "setting_normal_exit_action"
desc = "setting_normal_exit_action_desc"
type = "choice"
cli = ""
default = "exit"
[[tab.field.option]]
value = "exit"
label = "exit_action_exit"
[[tab.field.option]]
value = "return_to_launcher"
label = "exit_action_return_to_launcher"

[[tab.field]]
key = "general.crash_exit_action"
name = "setting_crash_exit_action"
desc = "setting_crash_exit_action_desc"
type = "choice"
cli = ""
default = "exit"
[[tab.field.option]]
value = "exit"
label = "exit_action_exit"
[[tab.field.option]]
value = "return_to_launcher"
label = "exit_action_return_to_launcher"
[[tab.field.option]]
value = "auto_restart"
label = "exit_action_auto_restart"

[[tab.field]]
key = "general.crash_restart_delay_secs"
name = "setting_crash_restart_delay"
desc = "setting_crash_restart_delay_desc"
type = "custom"
cli = ""
default = "2"

[[tab.field]]
key = "general.crash_restart_window_secs"
name = "setting_crash_restart_window"
desc = "setting_crash_restart_window_desc"
type = "custom"
cli = ""
default = "60"

[[tab.field]]
key = "general.crash_restart_max_fails"
name = "setting_crash_restart_max_fails"
desc = "setting_crash_restart_max_fails_desc"
type = "custom"
cli = ""
default = "5"
